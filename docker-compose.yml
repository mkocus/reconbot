services:
  reconbot:
    container_name: ${CONTAINER_NAME}
    hostname: "reconbot"
    build: '.'
    env_file:
    - .env
    volumes:
    # Secrets (refresh tokens) are mounted at runtime, never baked into the image.
    - ./characters.yaml:/app/characters.yaml:ro
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: 'always'
